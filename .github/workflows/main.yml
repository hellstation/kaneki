name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  ci:
    name: CI checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static sanity checks
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python -m compileall kaneki

      - name: Prepare local .env for compose validation
        run: cp .env.example .env

      - name: Validate docker compose config
        run: docker compose config

      - name: Build docker image
        run: docker build -t telegram-toolbox-bot:ci .

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Drop local bytecode before upload
        run: find . -type d -name '__pycache__' -prune -exec rm -rf {} + 2>/dev/null || true

      - name: Upload project to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          source: "Dockerfile,docker-compose.yml,requirements.txt,kaneki,assets,.env.example"
          target: "~/apps/telegram-toolbox-bot"
          strip_components: 0
          overwrite: true
          rm: false
          # Connection + transfer can be slow to some VPS; defaults (30s / 10m) are too tight
          timeout: 120s
          command_timeout: 30m

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          # Domain Security Analyzer — optional; empty secrets are fine
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
          CENSYS_API_ID: ${{ secrets.CENSYS_API_ID }}
          CENSYS_API_SECRET: ${{ secrets.CENSYS_API_SECRET }}
          REQUEST_TIMEOUT: ${{ secrets.REQUEST_TIMEOUT || '10' }}
          MAX_CVE_RESULTS: ${{ secrets.MAX_CVE_RESULTS || '5' }}
          DOMAIN_RATE_LIMIT_SECONDS: ${{ secrets.DOMAIN_RATE_LIMIT_SECONDS || '10' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          envs: BOT_TOKEN,NVD_API_KEY,SHODAN_API_KEY,CENSYS_API_ID,CENSYS_API_SECRET,REQUEST_TIMEOUT,MAX_CVE_RESULTS,DOMAIN_RATE_LIMIT_SECONDS
          # docker compose --build (maigret deps) often needs 15–30+ minutes on small VPS
          timeout: 120s
          command_timeout: 40m
          script_stop: true
          script: |
            set -e

            APP_DIR="$HOME/apps/telegram-toolbox-bot"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            {
              echo "BOT_TOKEN=${BOT_TOKEN}"
              echo "NVD_API_KEY=${NVD_API_KEY}"
              echo "SHODAN_API_KEY=${SHODAN_API_KEY}"
              echo "CENSYS_API_ID=${CENSYS_API_ID}"
              echo "CENSYS_API_SECRET=${CENSYS_API_SECRET}"
              echo "REQUEST_TIMEOUT=${REQUEST_TIMEOUT}"
              echo "MAX_CVE_RESULTS=${MAX_CVE_RESULTS}"
              echo "DOMAIN_RATE_LIMIT_SECONDS=${DOMAIN_RATE_LIMIT_SECONDS}"
            } > .env

            # Drop leftover monitoring stack from older deploys
            rm -rf monitoring

            if docker compose version >/dev/null 2>&1; then
              docker compose up -d --build --remove-orphans
            elif docker-compose version >/dev/null 2>&1; then
              docker-compose up -d --build --remove-orphans
            else
              echo "Docker Compose is not installed on VPS"
              exit 1
            fi
